name: Resource Submission
description: Submit a UI, UX, frontend, design or developer resource
title: "[Resource]: "
labels:
  - resource

body:

  - type: input
    id: name
    attributes:
      label: Resource Name
      placeholder: Evil Charts
    validations:
      required: true

  - type: input
    id: website
    attributes:
      label: Official Website
      placeholder: https://example.com
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - UI
        - UX
        - Frontend
        - Design
        - Inspiration
        - Learning
        - Developer Tools
    validations:
      required: true

  - type: input
    id: subcategory
    attributes:
      label: Subcategory

  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: Explain why this is useful.
    validations:
      required: true

  - type: input
    id: demo
    attributes:
      label: Demo URL

  - type: input
    id: documentation
    attributes:
      label: Documentation URL

  - type: input
    id: github
    attributes:
      label: GitHub URL

  - type: input
    id: video
    attributes:
      label: Video URL

  - type: input
    id: framework
    attributes:
      label: Framework

  - type: input
    id: pricing
    attributes:
      label: Pricing

  - type: input
    id: license
    attributes:
      label: License

  - type: input
    id: tags
    attributes:
      label: Tags
